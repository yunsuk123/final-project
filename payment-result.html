<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>결제 결과</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f7f8fc; font-family: 'Noto Sans KR', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: #fff; border-radius: 22px; box-shadow: 0 10px 30px rgba(74,108,247,0.10); padding: 40px 32px; max-width: 460px; width: 100%; text-align: center; }
    .icon { font-size: 60px; margin-bottom: 16px; }
    .title { font-size: 24px; font-weight: 800; color: #222; margin-bottom: 8px; }
    .sub { font-size: 14px; color: #888; margin-bottom: 28px; }
    .detail-box { background: #f0f2ff; border-radius: 14px; padding: 20px 24px; text-align: left; margin-bottom: 28px; }
    .detail-row { display: flex; justify-content: space-between; font-size: 14px; color: #444; padding: 7px 0; border-bottom: 1px solid #e0e4f7; }
    .detail-row:last-child { border-bottom: none; }
    .detail-row .val { font-weight: 800; color: #4a6cf7; text-align: right; max-width: 60%; }
    .btn-primary { display: block; width: 100%; padding: 15px; background: linear-gradient(135deg,#4a6cf7,#6d8dff); color: #fff; border: none; border-radius: 13px; font-size: 15px; font-weight: 800; cursor: pointer; text-decoration: none; text-align: center; }
    .btn-outline { display: block; width: 100%; padding: 13px; background: #fff; color: #4a6cf7; border: 2px solid #4a6cf7; border-radius: 13px; font-size: 14px; font-weight: 700; cursor: pointer; text-decoration: none; text-align: center; margin-top: 10px; }
    .fail .btn-primary { background: linear-gradient(135deg,#e24b4a,#f07070); }
    .saving-msg { font-size: 13px; color: #aaa; margin-top: 14px; min-height: 20px; }
  </style>
</head>
<body>

<div class="card" id="resultCard">
  <div class="icon"  id="resultIcon"></div>
  <div class="title" id="resultTitle"></div>
  <div class="sub"   id="resultSub"></div>
  <div class="detail-box" id="detailBox"></div>
  <a href="index.html"                 class="btn-primary" id="btnMain">메인으로 돌아가기</a>
  <a href="StudyCafe-reservation.html" class="btn-outline" id="btnRetry" style="display:none">다시 예약하기</a>
  <p class="saving-msg" id="savingMsg"></p>
</div>

<script src="./modal.js"></script>
<script type="module">
  import { auth, db } from "./firebase.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { collection, addDoc, doc, query, where, getDocs, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const params = new URLSearchParams(location.search);
  const isFail = params.get("fail") === "true";

  const methodLabel = {
    "카드": "신용/체크카드", "카카오페이": "카카오페이",
    "네이버페이": "네이버페이", "토스페이": "토스페이", "계좌이체": "계좌이체"
  };

  // ── 실패 처리 ──
  if (isFail) {
    document.getElementById("resultCard").classList.add("fail");
    document.getElementById("resultIcon").textContent  = "❌";
    document.getElementById("resultTitle").textContent = "결제에 실패했습니다.";
    document.getElementById("resultSub").textContent   = "결제가 취소되었거나 오류가 발생했습니다.";
    document.getElementById("detailBox").innerHTML = `
      <div class="detail-row"><span>오류 코드</span><span class="val">${params.get("code") || "-"}</span></div>
      <div class="detail-row"><span>오류 메시지</span><span class="val">${params.get("message") ? decodeURIComponent(params.get("message")) : "알 수 없는 오류"}</span></div>
    `;
    document.getElementById("btnRetry").style.display = "block";

  // ── 성공 처리 ──
  } else {

    // 파라미터 읽기
    const cafe       = params.get("cafe")       || "";
    const seat       = params.get("seat")       || "";
    const zoneRaw    = params.get("zone")       || "A";
    const typeRaw    = params.get("type")       || "daily";
    const optionKey  = params.get("optionKey")  || "0";
    const date       = params.get("date")       || "";
    const total      = parseInt(params.get("total") || "0");
    const method     = params.get("method")     || "";
    const paymentKey = params.get("paymentKey") || "";
    // ✅ orderId는 토스가 successUrl에 자동으로 붙여줌 — params에서 직접 읽음
    const orderId    = params.get("orderId")    || "";
    const cafeId     = params.get("cafeId")     || "";
    const days       = parseInt(params.get("days")  || "0");
    const hours      = parseInt(params.get("hours") || "0");
    const startTime  = params.get("startTime") || "";  // HH:MM 형식 입실 시각
    // 사물함 애드온
    const lockerSeat  = params.get("lockerSeat")  || "";
    const lockerDays  = parseInt(params.get("lockerDays")  || "0");
    const lockerPrice = parseInt(params.get("lockerPrice") || "0");

    // ✅ 필수값 검증 — cafeId, seat, orderId 없으면 빈 문서 생성 차단
    if (!cafeId || !seat || !orderId || total === 0) {
      document.getElementById("resultIcon").textContent  = "⚠️";
      document.getElementById("resultTitle").textContent = "결제 정보를 확인할 수 없습니다.";
      document.getElementById("resultSub").textContent   = "이미 처리된 결제이거나 잘못된 접근입니다.";
      document.getElementById("detailBox").style.display = "none";
      document.getElementById("savingMsg").textContent   = "저장이 중단되었습니다.";
      // 스크립트 종료
      throw new Error("필수 파라미터 없음 — 저장 중단");
    }

    const typeLabels = { daily:"당일권", period:"기간권", fixed:"고정석", room:"스터디룸", locker:"사물함" };
    const timeDisplay = (typeRaw === "daily" || typeRaw === "room")
      ? `${optionKey}시간 이용`
      : `${optionKey}일 이용`;

    document.getElementById("resultIcon").textContent  = "✅";
    document.getElementById("resultTitle").textContent = "예약이 완료되었습니다!";
    document.getElementById("resultSub").textContent   = "즐거운 스터디 되세요 😊";
    document.getElementById("detailBox").innerHTML = `
      <div class="detail-row"><span>지점</span>    <span class="val">${cafe}</span></div>
      <div class="detail-row"><span>이용권</span>  <span class="val">${typeLabels[typeRaw] || typeRaw}</span></div>
      <div class="detail-row"><span>좌석</span>    <span class="val">${seat}</span></div>
      <div class="detail-row"><span>날짜</span>    <span class="val">${date}</span></div>
      <div class="detail-row"><span>이용</span>    <span class="val">${timeDisplay}</span></div>
      ${startTime ? `<div class="detail-row"><span>🕐 입실 시각</span><span class="val">${startTime}</span></div>` : ""}
      <div class="detail-row"><span>결제 금액</span><span class="val">${total.toLocaleString()}원</span></div>
      <div class="detail-row"><span>결제 수단</span><span class="val">${methodLabel[method] || method}</span></div>
      ${lockerSeat ? `<div class="detail-row"><span>🔒 사물함</span><span class="val">${lockerSeat} · ${lockerDays}일 (+${lockerPrice.toLocaleString()}원)</span></div>` : ""}
      <div class="detail-row"><span>주문 번호</span><span class="val" style="font-size:12px">${orderId}</span></div>
    `;

    // ─────────────────────────────────────────────────────
    // Firestore 저장
    // 수정 사항:
    // 1. saved 플래그 → onAuthStateChanged 중복 발화 방지
    // 2. orderId로 중복 문서 체크 → 이미 저장된 경우 재저장 안 함
    // 3. 필수값 없으면 위에서 이미 차단됨
    // 4. end/start 변수 제거 → optionKey/hours로 endTime 계산
    // ─────────────────────────────────────────────────────
    let saved = false;
    const savingMsg = document.getElementById("savingMsg");
    savingMsg.textContent = "예약 정보 저장 중...";

    onAuthStateChanged(auth, async (user) => {
      if (saved) return;   // 중복 발화 방지
      if (!user) return;   // 세션 복구 대기

      saved = true;
      savingMsg.textContent = "예약 정보를 기록하는 중...";

      try {
        // ✅ 중복 저장 방지: orderId로 기존 문서 확인
        const dupCheck = await getDocs(query(
          collection(db, "reservations"),
          where("orderId", "==", orderId)
        ));
        if (!dupCheck.empty) {
          savingMsg.textContent = "✅ 예약이 이미 기록되어 있습니다.";
          console.log("중복 저장 방지: 이미 존재하는 orderId");
          return;
        }

        // 저장할 데이터
        const reservationData = {
          uid:             user.uid,
          email:           user.email || "",
          cafeId,
          cafeName:        cafe,
          seatId:          seat,
          zone:            zoneRaw,
          reservationType: typeRaw,
          date,
          status:          "confirmed",
          totalPrice:      total,
          payMethod:       method,
          paymentKey,
          orderId,
          createdAt:       serverTimestamp()
        };

        // 사물함 애드온 정보 저장
        if (lockerSeat && lockerDays > 0) {
          reservationData.lockerAddon = {
            seatId:    lockerSeat,
            days:      lockerDays,
            price:     lockerPrice,
            status:    "confirmed"
          };
        }

        // 타입별 기간/시간 저장
        if (typeRaw === "daily" || typeRaw === "room") {
          reservationData.hours = hours || parseInt(optionKey);
          // 입실 시각 저장 (startTime = HH:MM)
          if (startTime) {
            reservationData.startTime = startTime;
            // startTime 기준으로 실제 시작 timestamp 계산
            const [hh, mm] = startTime.split(":").map(Number);
            const startDate = new Date(date + "T" + startTime + ":00");
            reservationData.startTimestamp = startDate.getTime();
            reservationData.endTimestamp   = startDate.getTime() + (hours || parseInt(optionKey)) * 3600 * 1000;
          }
        } else {
          reservationData.days = days || parseInt(optionKey);
        }

        await addDoc(collection(db, "reservations"), reservationData);


        savingMsg.textContent = "✅ 예약이 정상적으로 기록되었습니다.";
        console.log("Firestore 저장 성공:", orderId);

      } catch (e) {
        console.error("Firestore 저장 오류:", e);
        savingMsg.textContent = "⚠️ 예약 저장 중 오류가 발생했습니다. 고객센터에 문의해주세요.";
      }
    });
  }
</script>

</body>
</html>
