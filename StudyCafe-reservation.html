<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스터디카페 지점 선택</title>

  <link rel="stylesheet" href="index.css">

  <script type="text/javascript"
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=6ce8a915000c6718bf65ac51e6e0c214&libraries=services&autoload=false">
  </script>

  <style>
    .reservation-wrap {
      background: #f7f8fc;
      min-height: 100vh;
      padding: 50px 0;
    }

    .reservation-title {
      text-align: center;
      margin-bottom: 30px;
    }

    .reservation-title h1 {
      color: #4a6cf7;
      font-size: 34px;
      margin-bottom: 10px;
    }

    .reservation-map-card {
      background: #fff;
      padding: 24px;
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(74,108,247,0.12);
      margin-bottom: 30px;
    }

    #reservation-map {
      width: 100%;
      height: 360px;
      border-radius: 16px;
      border: 1px solid #eee;
    }

    .cafe-list-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .cafe-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
    }

    .cafe-card {
      background: #fff;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }

    .cafe-card h3 {
      color: #4a6cf7;
      margin-bottom: 8px;
    }

    .cafe-card p {
      color: #555;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .cafe-card a {
      display: block;
      margin-top: 14px;
      padding: 12px;
      text-align: center;
      background: linear-gradient(135deg, #4a6cf7, #6d8dff);
      color: #fff;
      border-radius: 12px;
      font-weight: 800;
      text-decoration: none;
    }

    .back-btn {
      display: block;
      width: fit-content;
      margin: 30px auto 0;
      color: #4a6cf7;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <section class="reservation-wrap">
    <div class="container">

      <div class="reservation-title">
        <h1>스터디카페 지점 선택</h1>
        <p id="reservationDesc">회원가입 지역 기준으로 주변 스터디카페를 불러오는 중입니다.</p>
      </div>

      <div class="reservation-map-card">
        <div id="reservation-map"></div>
      </div>

      <h2 class="cafe-list-title" id="cafeListTitle">주변 스터디카페</h2>
      <div class="cafe-list" id="cafeList"></div>

      <a href="index.html" class="back-btn">메인으로 돌아가기</a>

    </div>
  </section>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const cafeList = document.getElementById("cafeList");
    const reservationDesc = document.getElementById("reservationDesc");
    const cafeListTitle = document.getElementById("cafeListTitle");

    let map = null;
    let ps = null;
    let geocoder = null;
    let activeInfoWindow = null;
    let currentRegion = "";

    function startReservationMap(region) {
      kakao.maps.load(() => {
        const mapContainer = document.getElementById("reservation-map");

        const mapOption = {
          center: new kakao.maps.LatLng(37.566826, 126.9786567),
          level: 5
        };

        map = new kakao.maps.Map(mapContainer, mapOption);
        ps = new kakao.maps.services.Places();
        geocoder = new kakao.maps.services.Geocoder();

        searchStudyCafeByRegion(region);
      });
    }

    function moveMapToRegion(region) {
      geocoder.addressSearch(region, (result, status) => {
        if (status === kakao.maps.services.Status.OK && result.length > 0) {
          const coords = new kakao.maps.LatLng(result[0].y, result[0].x);
          map.setCenter(coords);
          map.setLevel(5);
        }
      });
    }

    function searchStudyCafeByRegion(region) {
      currentRegion = region;

      reservationDesc.textContent = `${region} 주변 스터디카페를 확인하고 원하는 지점을 선택하세요.`;
      cafeListTitle.textContent = `${region} 주변 스터디카페`;

      moveMapToRegion(region);

      const keyword = `${region} 스터디카페`;

      ps.keywordSearch(keyword, (data, status) => {
        if (status !== kakao.maps.services.Status.OK || data.length === 0) {
          cafeList.innerHTML = `<p>${region} 주변 스터디카페 검색 결과가 없습니다.</p>`;
          return;
        }

        renderPlaces(data);
      });
    }

    function renderPlaces(data) {
      cafeList.innerHTML = "";

      const bounds = new kakao.maps.LatLngBounds();

      data.slice(0, 10).forEach((place) => {
        const point = new kakao.maps.LatLng(place.y, place.x);

        const marker = new kakao.maps.Marker({
          map: map,
          position: point
        });

        const infowindow = new kakao.maps.InfoWindow({
          content: `
            <div style="padding:8px 12px;font-size:13px;font-weight:700;color:#4a6cf7;">
              ${place.place_name}
            </div>
          `
        });

        kakao.maps.event.addListener(marker, "click", () => {
          if (activeInfoWindow) {
            activeInfoWindow.close();
          }

          infowindow.open(map, marker);
          activeInfoWindow = infowindow;
        });

        bounds.extend(point);

        const card = document.createElement("div");
        card.className = "cafe-card";

        card.innerHTML = `
          <h3>${place.place_name}</h3>
          <p><strong>주소:</strong> ${place.road_address_name || place.address_name || "주소 정보 없음"}</p>
          <p><strong>전화:</strong> ${place.phone || "전화번호 정보 없음"}</p>
          <a href="${place.place_url}" target="_blank">카카오맵 상세보기</a>
        `;

        cafeList.appendChild(card);
      });

      map.setBounds(bounds);
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        alert("로그인 후 이용해주세요.");
        location.href = "login.html";
        return;
      }

      const userDoc = await getDoc(doc(db, "users", user.uid));

      if (!userDoc.exists()) {
        alert("회원 정보를 찾을 수 없습니다.");
        location.href = "index.html";
        return;
      }

      const userData = userDoc.data();

      const region =
        userData.region ||
        `${userData.sido || ""} ${userData.sigungu || ""} ${userData.dong || ""}`.trim();

      if (!region) {
        alert("스터디카페를 추천받으려면 먼저 지역을 설정해주세요.");
            location.href = "mypage.html";
            return;
        }

      currentRegion = region;

      const checkInterval = setInterval(() => {
        if (typeof kakao !== "undefined" && kakao.maps) {
          clearInterval(checkInterval);
          startReservationMap(currentRegion);
        }
      }, 100);
    });
  </script>

</body>
</html>
