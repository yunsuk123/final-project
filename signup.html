<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원가입 | Study Cafe</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Pretendard", "Malgun Gothic", sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: #eef3ff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 0;
    }
    .signup-box {
      width: 460px;
      background: #fff;
      padding: 42px 32px;
      border-radius: 18px;
      box-shadow: 0 16px 35px rgba(74, 108, 247, 0.12);
    }
    h1 { text-align: center; color: #5968f2; margin-bottom: 8px; font-size: 32px; }
    .sub-title { text-align: center; color: #666; margin-bottom: 24px; font-size: 15px; }

    /* 탭 */
    .role-tabs { display: flex; gap: 10px; margin-bottom: 28px; }
    .role-tabs button {
      flex: 1; height: 46px;
      border: 2px solid #d6ddff; border-radius: 12px;
      background: #fff; color: #888;
      font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 0;
      transition: all 0.2s;
    }
    .role-tabs button.active { background: #5968f2; border-color: #5968f2; color: #fff; }
    .role-tabs button:hover:not(.active) { border-color: #5968f2; color: #5968f2; }

    .form-section { display: none; }
    .form-section.active { display: block; }

    label { display: block; margin: 16px 0 8px; font-weight: 700; font-size: 14px; color: #333; }
    input, select {
      width: 100%; height: 50px;
      border: 1px solid #d6ddff; border-radius: 10px;
      padding: 0 14px; font-size: 15px; outline: none; background: #fff;
    }
    input:focus, select:focus { border-color: #5968f2; }
    .region-help { margin-top: 8px; font-size: 12px; color: #777; line-height: 1.5; }
    .submit-btn {
      width: 100%; height: 50px; margin-top: 28px;
      border: none; border-radius: 10px;
      background: #5968f2; color: #fff;
      font-size: 16px; font-weight: 800; cursor: pointer; transition: background 0.2s;
    }
    .submit-btn:hover { background: #4656e8; }
    .message { margin-top: 16px; text-align: center; font-size: 14px; min-height: 20px; color: #d93025; }
    .message.success { color: #1a8a3c; }
    .links { text-align: center; margin-top: 18px; font-size: 14px; color: #666; }
    .links a { color: #4a6cf7; text-decoration: none; font-weight: 700; margin-left: 6px; }
    .home-link { display: block; text-align: center; margin-top: 18px; color: #888; text-decoration: none; font-size: 14px; }
    .home-link:hover { color: #5968f2; }
  </style>
</head>
<body>
  <div class="signup-box">
    <h1>Study Cafe</h1>
    <p class="sub-title" id="subTitle">스터디카페 회원가입</p>

    <div class="role-tabs">
      <button id="tabUser" class="active" onclick="switchTab('user')">👤 일반 사용자</button>
      <button id="tabAdmin" onclick="switchTab('admin')">🏢 관리자</button>
    </div>

    <!-- 일반 사용자 폼 -->
    <div id="userSection" class="form-section active">
      <form id="userSignupForm">
        <label for="userName">이름</label>
        <input type="text" id="userName" placeholder="이름을 입력하세요" required />

        <label for="userEmail">이메일</label>
        <input type="email" id="userEmail" placeholder="이메일을 입력하세요" required />

        <label for="userPassword">비밀번호</label>
        <input type="password" id="userPassword" placeholder="비밀번호를 입력하세요" required />

        <label for="userConfirmPassword">비밀번호 확인</label>
        <input type="password" id="userConfirmPassword" placeholder="비밀번호를 다시 입력하세요" required />

        <label for="sido">시/도</label>
        <select id="sido" required>
          <option value="">시/도 선택</option>
          <option value="서울특별시">서울특별시</option>
          <option value="부산광역시">부산광역시</option>
          <option value="대구광역시">대구광역시</option>
          <option value="인천광역시">인천광역시</option>
          <option value="광주광역시">광주광역시</option>
          <option value="대전광역시">대전광역시</option>
          <option value="울산광역시">울산광역시</option>
          <option value="세종특별자치시">세종특별자치시</option>
          <option value="경기도">경기도</option>
          <option value="강원특별자치도">강원특별자치도</option>
          <option value="충청북도">충청북도</option>
          <option value="충청남도">충청남도</option>
          <option value="전북특별자치도">전북특별자치도</option>
          <option value="전라남도">전라남도</option>
          <option value="경상북도">경상북도</option>
          <option value="경상남도">경상남도</option>
          <option value="제주특별자치도">제주특별자치도</option>
        </select>

        <label for="sigungu">시/군/구</label>
        <select id="sigungu" required disabled>
          <option value="">시/군/구 선택</option>
        </select>

        <label for="dong">동/읍/면</label>
        <input type="text" id="dong" placeholder="예: 고읍동, 정릉동, 역삼동" required />
        <p class="region-help">
          입력한 지역을 기준으로 주변 스터디카페가 자동 검색됩니다.<br>
          예: 경기도 / 양주시 / 고읍동
        </p>

        <button type="submit" class="submit-btn">회원가입</button>
        <p id="userMessage" class="message"></p>
      </form>
    </div>

    <!-- 관리자 폼 -->
    <div id="adminSection" class="form-section">
      <form id="adminSignupForm">
        <label for="adminName">이름</label>
        <input type="text" id="adminName" placeholder="이름을 입력하세요" required />

        <label for="adminEmail">이메일</label>
        <input type="email" id="adminEmail" placeholder="이메일을 입력하세요" required />

        <label for="adminPassword">비밀번호</label>
        <input type="password" id="adminPassword" placeholder="비밀번호를 입력하세요" required />

        <label for="adminConfirmPassword">비밀번호 확인</label>
        <input type="password" id="adminConfirmPassword" placeholder="비밀번호를 다시 입력하세요" required />

        <button type="submit" class="submit-btn">관리자 가입</button>
        <p id="adminMessage" class="message"></p>
      </form>
    </div>

    <div class="links">이미 계정이 있으신가요? <a href="login.html">로그인</a></div>
    <a class="home-link" href="index.html">메인으로 돌아가기</a>
  </div>

  <script>
    function switchTab(role) {
      const isUser = role === 'user';
      document.getElementById('tabUser').classList.toggle('active', isUser);
      document.getElementById('tabAdmin').classList.toggle('active', !isUser);
      document.getElementById('userSection').classList.toggle('active', isUser);
      document.getElementById('adminSection').classList.toggle('active', !isUser);
      document.getElementById('subTitle').textContent = isUser ? '스터디카페 회원가입' : '관리자 회원가입';
    }

    const regionData = {
      "서울특별시": ["강남구","강동구","강북구","강서구","관악구","광진구","구로구","금천구","노원구","도봉구","동대문구","동작구","마포구","서대문구","서초구","성동구","성북구","송파구","양천구","영등포구","용산구","은평구","종로구","중구","중랑구"],
      "부산광역시": ["강서구","금정구","기장군","남구","동구","동래구","부산진구","북구","사상구","사하구","서구","수영구","연제구","영도구","중구","해운대구"],
      "대구광역시": ["군위군","남구","달서구","달성군","동구","북구","서구","수성구","중구"],
      "인천광역시": ["강화군","계양구","남동구","동구","미추홀구","부평구","서구","연수구","옹진군","중구"],
      "광주광역시": ["광산구","남구","동구","북구","서구"],
      "대전광역시": ["대덕구","동구","서구","유성구","중구"],
      "울산광역시": ["남구","동구","북구","울주군","중구"],
      "세종특별자치시": ["세종시"],
      "경기도": ["가평군","고양시","과천시","광명시","광주시","구리시","군포시","김포시","남양주시","동두천시","부천시","성남시","수원시","시흥시","안산시","안성시","안양시","양주시","양평군","여주시","연천군","오산시","용인시","의왕시","의정부시","이천시","파주시","평택시","포천시","하남시","화성시"],
      "강원특별자치도": ["강릉시","고성군","동해시","삼척시","속초시","양구군","양양군","영월군","원주시","인제군","정선군","철원군","춘천시","태백시","평창군","홍천군","화천군","횡성군"],
      "충청북도": ["괴산군","단양군","보은군","영동군","옥천군","음성군","제천시","증평군","진천군","청주시","충주시"],
      "충청남도": ["계룡시","공주시","금산군","논산시","당진시","보령시","부여군","서산시","서천군","아산시","예산군","천안시","청양군","태안군","홍성군"],
      "전북특별자치도": ["고창군","군산시","김제시","남원시","무주군","부안군","순창군","완주군","익산시","임실군","장수군","전주시","정읍시","진안군"],
      "전라남도": ["강진군","고흥군","곡성군","광양시","구례군","나주시","담양군","목포시","무안군","보성군","순천시","신안군","여수시","영광군","영암군","완도군","장성군","장흥군","진도군","함평군","해남군","화순군"],
      "경상북도": ["경산시","경주시","고령군","구미시","김천시","문경시","봉화군","상주시","성주군","안동시","영덕군","영양군","영주시","영천시","예천군","울릉군","울진군","의성군","청도군","청송군","칠곡군","포항시"],
      "경상남도": ["거제시","거창군","고성군","김해시","남해군","밀양시","사천시","산청군","양산시","의령군","진주시","창녕군","창원시","통영시","하동군","함안군","함양군","합천군"],
      "제주특별자치도": ["서귀포시","제주시"]
    };

    const sidoSelect = document.getElementById("sido");
    const sigunguSelect = document.getElementById("sigungu");

    sidoSelect.addEventListener("change", () => {
      const selected = sidoSelect.value;
      sigunguSelect.innerHTML = '<option value="">시/군/구 선택</option>';
      sigunguSelect.disabled = true;
      if (!selected) return;
      regionData[selected].forEach(s => {
        const opt = document.createElement("option");
        opt.value = s; opt.textContent = s;
        sigunguSelect.appendChild(opt);
      });
      sigunguSelect.disabled = false;
    });
  </script>

  <script type="module" src="signup.js"></script>
</body>
</html>
