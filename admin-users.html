<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>회원 관리 | Study Spot</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Pretendard", "Malgun Gothic", sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #222;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .admin-layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 270px;
      background: #1f2430;
      color: #fff;
      padding: 30px 20px;
    }

    .sidebar h1 {
      font-size: 30px;
      color: #6f86ff;
      margin-bottom: 24px;
    }

    .admin-badge {
      background: rgba(255, 255, 255, 0.08);
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 24px;
      font-size: 14px;
      line-height: 1.6;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .menu button {
      width: 100%;
      border: none;
      background: #2b3142;
      color: #fff;
      padding: 15px 16px;
      border-radius: 12px;
      text-align: left;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .menu button.active {
      background: #4a6cf7;
    }

    .content {
      flex: 1;
      padding: 32px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-bottom: 28px;
    }

    .card {
      background: #fff;
      padding: 24px;
      border-radius: 18px;
    }

    .panel {
      background: #fff;
      border-radius: 20px;
      padding: 28px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 14px;
      border-bottom: 1px solid #eee;
    }

    .status-active {
      color: #1db954;
      font-weight: 700;
    }

    .status-stop {
      color: #ff4d4f;
      font-weight: 700;
    }

    .delete-btn {
      border: none;
      background: #ff4d4f;
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="admin-layout">

    <aside class="sidebar">
      <h1>Study Spot</h1>

      <div class="menu">
        <a href="admin.html"><button>관리자 홈</button></a>
        <a href="admin-users.html"><button class="active">회원 관리</button></a>
      </div>
    </aside>

    <main class="content">

      <div class="topbar">
        <h2>회원 관리</h2>
      </div>

      <div class="panel">
        <h3>회원 목록</h3>

        <table>
          <thead>
            <tr>
              <th>이름</th>
              <th>이메일</th>
              <th>가입일</th>
              <th>신고 횟수</th> <!-- 🔥 추가 -->
              <th>정지 상태</th> <!-- 🔥 추가 -->
              <th>관리</th>
            </tr>
          </thead>

          <tbody id="userTableBody">
            <tr>
              <td colspan="6">불러오는 중...</td>
            </tr>
          </tbody>

        </table>
      </div>

    </main>
  </div>

  <script type="module" src="admin-users.js"></script>
</body>
</html>
